name: Test New Features (sem RapidAPI)

on:
  workflow_dispatch: {}   # só corre manualmente, nunca por agendamento

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: DIAGNÓSTICO — curl verboso ao atp_players.csv (raw.githubusercontent e jsDelivr)
        run: |
          echo "=== raw.githubusercontent.com ==="
          curl -v "https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_players.csv" 2>&1 | head -40
          echo ""
          echo "=== jsDelivr ==="
          curl -v "https://cdn.jsdelivr.net/gh/JeffSackmann/tennis_atp@master/atp_players.csv" 2>&1 | head -40
        continue-on-error: true

      - name: Testar novas funções (histórico, lesão, serviço/resposta, ranking, meteorologia)
        run: python -m src.test_new_features
