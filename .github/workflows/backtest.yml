name: Backtest (sinais vs mercado histórico)

on:
  workflow_dispatch: {}   # só corre manualmente — é pesado, não faz sentido agendar

concurrency:
  group: tennis-backtest-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # necessário para gravar o resultado no repo
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Correr o backtest
        run: python -m src.backtest

      - name: Gravar resultado do backtest no repositório
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/backtest_results/
          git commit -m "chore: resultado do backtest [skip ci]" || echo "Sem alterações a gravar."
          bash scripts/publish-generated-changes.sh "chore: resultado do backtest"
