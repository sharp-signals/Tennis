name: Refresh observational views
on:
  # The existing Sheet sync commits use [skip ci]. A push-only trigger would
  # never run. Observe successful Pages publication, then check the exact diff.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: tennis-pre-live-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never execute code or artifacts from a PR or from the triggering ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Check whether the public manual aggregate changed
        id: guard
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/manual_refresh_trigger.py --event "$TRIGGER_EVENT" --source-sha "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.guard.outputs.needed == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
        if: steps.guard.outputs.needed == 'true'
      - name: Refresh views without acquisition or settlement
        if: steps.guard.outputs.needed == 'true'
        run: python -m scripts.refresh_observability
        env:
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: '0'
          THE_ODDS_API_ENABLED: '0'
      - name: Publish derived views only
        if: steps.guard.outputs.needed == 'true'
        run: |
          git config user.name 'tennis-bot'
          git config user.email 'actions@github.com'
          git add data/dashboard/ docs/dashboard/ data/validation/ data/market_ledger/derived/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh derived observation views [skip ci]'
            bash scripts/publish-generated-changes.sh 'chore: refresh derived observation views'
          fi
