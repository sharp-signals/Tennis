name: Refresh observational views
on:
  push:
    branches: [main]
    paths: [data/manual_paper_22bet.json]
concurrency:
  group: tennis-pre-live-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Refresh views without acquisition or settlement
        run: python -m scripts.refresh_observability
        env:
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: '0'
          THE_ODDS_API_ENABLED: '0'
      - name: Publish derived views only
        run: |
          git config user.name 'tennis-bot'
          git config user.email 'actions@github.com'
          git add data/dashboard/ docs/dashboard/ data/validation/ data/market_ledger/derived/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh derived observation views [skip ci]'
            bash scripts/publish-generated-changes.sh 'chore: refresh derived observation views'
          fi
