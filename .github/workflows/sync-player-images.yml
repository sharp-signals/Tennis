name: Sincronizar fotografias ATP/WTA

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Jogadores por circuito
        required: true
        default: "200"
  push:
    branches: [main]
    paths:
      - scripts/sync_player_images.py
      - .github/workflows/sync-player-images.yml

concurrency:
  group: sync-player-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Obter rankings e fotografias licenciadas
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/sync_player_images.py --limit "${{ inputs.limit || '200' }}"
      - name: Publicar acervo
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/player_images.json data/player_images_review.json \
            data/rapidapi_usage_log.json data/rapidapi_usage_inflight.json \
            docs/assets/players/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sincronizar fotografias top 200 ATP/WTA [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
