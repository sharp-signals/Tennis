name: Audit contextual rolling refit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Restaurar replay cronológico
        uses: actions/cache@v6
        with:
          path: .tmp/contextual-rating-replay
          key: contextual-rating-replay-v9-${{ hashFiles('src/contextual_family_replay.py', 'src/contextual_family_methodology.py') }}
      - name: Instalar dependências
        run: pip install -r requirements.lock
      - name: Confirmar replay existente
        run: |
          test -f .tmp/contextual-rating-replay/atp.jsonl.gz
          test -f .tmp/contextual-rating-replay/wta.jsonl.gz
      - name: Recalibrar candidatos em janelas cronológicas
        run: |
          python -m scripts.audit_contextual_rolling_refit_v1 \
            --replay-dir .tmp/contextual-rating-replay \
            --release data/models/fenzobot-contextual-2026-11.json \
            --output .tmp/contextual-rolling-refit-v1.json
      - name: Guardar auditoria
        uses: actions/upload-artifact@v7
        with:
          name: contextual-rolling-refit-v1
          path: .tmp/contextual-rolling-refit-v1.json
          if-no-files-found: error
