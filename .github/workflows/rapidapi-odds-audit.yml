name: RapidAPI Odds Audit

on:
  workflow_dispatch:
    inputs:
      player_a:
        description: Primeiro jogador, como aparece no fixture
        required: true
        type: string
      player_b:
        description: Segundo jogador, como aparece no fixture
        required: true
        type: string
      event_date:
        description: Data do evento (YYYY-MM-DD)
        required: true
        type: string
      tour:
        description: Tour
        required: true
        type: choice
        options: [atp, wta]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependências
        run: pip install -r requirements.lock
      - name: Auditar rotas de odds RapidAPI
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "20"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        run: >-
          python -m scripts.audit_rapidapi_odds
          --player-a "${{ inputs.player_a }}"
          --player-b "${{ inputs.player_b }}"
          --event-date "${{ inputs.event_date }}"
          --tour "${{ inputs.tour }}"
      - name: Guardar resultado da auditoria
        uses: actions/upload-artifact@v7
        with:
          name: rapidapi-odds-audit
          path: artifacts/rapidapi_odds_audit/result.json
          if-no-files-found: error
