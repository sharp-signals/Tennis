name: Build contextual rating A/B

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/contextual-rating-ab-build.yml"
      - "scripts/build_contextual_rating_ab_v1.py"
      - "scripts/audit_contextual_primary_conflict_v15.py"
      - "scripts/build_contextual_family_combination_v16.py"
      - "scripts/calibrate_contextual_uncertainty_v16.py"
      - "scripts/build_contextual_family_combination_v17.py"
      - "scripts/calibrate_contextual_uncertainty_v17.py"
      - "scripts/build_contextual_family_combination_v18.py"
      - "scripts/calibrate_contextual_uncertainty_v18.py"
      - "scripts/run_contextual_shadow_v2.py"
      - "src/contextual_chronological_rating.py"
      - "src/contextual_family_combination_v16.py"
      - "src/contextual_probability_uncertainty_v16.py"
      - "src/contextual_family_combination_v17.py"
      - "src/contextual_probability_uncertainty_v17.py"
      - "src/contextual_family_combination_v18.py"
      - "src/contextual_probability_uncertainty_v18.py"
      - "src/contextual_family_hierarchy.py"
      - "src/contextual_family_replay.py"
      - "src/contextual_rating_ab_v1.py"
      - "src/contextual_surface_ledger.py"
      - "data/models/contextual-rating-ab-v1.json"
      - "data/models/contextual-family-combination-v16.json"
      - "data/models/contextual-probability-uncertainty-v16.json"
      - "data/models/contextual-family-combination-v17.json"
      - "data/models/contextual-probability-uncertainty-v17.json"
      - "data/models/contextual-family-combination-v18.json"
      - "data/models/contextual-probability-uncertainty-v18.json"
      - "data/models/fenzobot-contextual-2026-11.json"
      - "data/models/fenzobot-contextual-2026-11-manifest.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependências
        run: pip install -r requirements.lock -r requirements-dev.txt pytest==8.3.5
      - name: Restaurar replay cronológico
        uses: actions/cache@v4
        with:
          path: .tmp/contextual-rating-replay
          key: contextual-rating-replay-v9-${{ hashFiles('src/contextual_family_replay.py', 'src/contextual_family_methodology.py') }}
      - name: Construir replay histórico uma vez
        run: |
          if [ ! -f .tmp/contextual-rating-replay/atp.jsonl.gz ] || [ ! -f .tmp/contextual-rating-replay/wta.jsonl.gz ]; then
            python -m scripts.compare_contextual_family_combinations_v5 \
              --replay-cache-dir .tmp/contextual-rating-replay \
              --output .tmp/replay-audit.json
          fi
      - name: Auditar conflito entre famílias principais
        run: |
          python -m scripts.audit_contextual_primary_conflict_v15 \
            --replay-input-dir .tmp/contextual-rating-replay \
            --contract data/models/contextual-family-combination-v14.json \
            --output .tmp/contextual-primary-conflict-v15.json
      - name: Construir combinação e incerteza v18
        run: |
          python -m scripts.build_contextual_family_combination_v18 \
            --replay-input-dir .tmp/contextual-rating-replay \
            --baseline-contract data/models/contextual-family-combination-v17.json \
            --output .tmp/v18/contextual-family-combination-v18.json
          python -m scripts.calibrate_contextual_uncertainty_v18 \
            --replay-input-dir .tmp/contextual-rating-replay \
            --combination-contract .tmp/v18/contextual-family-combination-v18.json \
            --output .tmp/v18/contextual-probability-uncertainty-v18.json
          cp .tmp/v18/contextual-family-combination-v18.json data/models/
          cp .tmp/v18/contextual-probability-uncertainty-v18.json data/models/
          python -m scripts.export_fenzobot_contextual_release
      - name: Congelar candidatos A/B sobre o release exportado
        run: |
          python -m scripts.build_contextual_rating_ab_v1 \
            --replay-input-dir .tmp/contextual-rating-replay \
            --release-contract data/models/fenzobot-contextual-2026-11.json \
            --output data/models/contextual-rating-ab-v1.json
      - name: Testes específicos
        run: |
          python scripts/plan_validation.py --level 3 \
            --file src/contextual_chronological_rating.py \
            --file src/contextual_rating_ab_v1.py \
            --file scripts/build_contextual_rating_ab_v1.py \
            --file scripts/run_contextual_shadow_v2.py \
            --file scripts/run_fenzobot_contextual_2026_11.py
          ruff check src/contextual_chronological_rating.py \
            src/contextual_rating_ab_v1.py \
            src/contextual_family_combination_v16.py \
            src/contextual_probability_uncertainty_v16.py \
            src/contextual_family_combination_v17.py \
            src/contextual_probability_uncertainty_v17.py \
            src/contextual_family_combination_v18.py \
            src/contextual_probability_uncertainty_v18.py \
            scripts/audit_contextual_primary_conflict_v15.py \
            scripts/build_contextual_family_combination_v16.py \
            scripts/calibrate_contextual_uncertainty_v16.py \
            scripts/build_contextual_family_combination_v17.py \
            scripts/calibrate_contextual_uncertainty_v17.py \
            scripts/build_contextual_family_combination_v18.py \
            scripts/calibrate_contextual_uncertainty_v18.py \
            scripts/build_contextual_rating_ab_v1.py \
            scripts/audit_contextual_tier_win_credit_v1.py \
            scripts/run_contextual_shadow_v2.py \
            scripts/run_fenzobot_contextual_2026_11.py \
            tests/test_contextual_chronological_rating.py \
            tests/test_contextual_rating_ab_v1.py
          python -m pytest -q \
            tests/test_audit_contextual_primary_conflict_v15.py \
            tests/test_contextual_family_combination_v16.py \
            tests/test_contextual_family_combination_v17.py \
            tests/test_contextual_family_combination_v18.py \
            tests/test_contextual_chronological_rating.py \
            tests/test_contextual_rating_ab_v1.py \
            tests/test_run_contextual_shadow_v2.py \
            tests/test_run_fenzobot_contextual_2026_11.py \
            tests/test_contextual_family_calibration.py \
            tests/test_contextual_family_combination_v14.py \
            tests/test_contextual_tier_win_credit_audit.py
      - name: Checkpoint CI completo
        env:
          LLM_MODE: mock
          LLM_POLICY: selective
          ALLOW_PAID_LLM: "0"
        run: |
          ruff check src tests scripts
          python scripts/check_secrets.py
          node --test scripts/google_apps_script/*.test.js
          coverage run -m unittest discover -s tests -v
          coverage run --append tests/test_motor.py
          coverage report
      - name: Guardar contrato congelado
        uses: actions/upload-artifact@v7
        with:
          name: contextual-rating-ab-v1
          path: data/models/contextual-rating-ab-v1.json
          if-no-files-found: error
      - name: Guardar auditoria do conflito primário
        uses: actions/upload-artifact@v7
        with:
          name: contextual-primary-conflict-v15
          path: .tmp/contextual-primary-conflict-v15.json
          if-no-files-found: error
      - name: Guardar contratos v18
        uses: actions/upload-artifact@v7
        with:
          name: contextual-unanimous-consensus-v18-contracts
          path: .tmp/v18/*.json
          if-no-files-found: error
