name: Pending Pre-Live Market Retry

on:
  # Corre após cada execução completa e consulta apenas a fila persistida.
  # Não relança o Fenzobot, não envia relatórios e não usa Claude.
  workflow_run:
    workflows: ["Tennis Pre-Live Bot"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: tennis-pending-market-retry
  cancel-in-progress: false

jobs:
  retry-pending-markets:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Reconsultar apenas mercados pendentes
        env:
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "120"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          PENDING_MARKET_RETRY_MAX_PER_RUN: "20"
        run: python scripts/retry_pending_markets.py

      - name: Guardar a fila e identidades recuperadas
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/cache/pending_market_checks.json data/cache/rapidapi_event_identity.json \
            data/rapidapi_usage_log.json data/rapidapi_usage_inflight.json 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: reconsultar mercados pré-live pendentes [skip ci]"
            git pull --rebase --autostash origin main
            bash scripts/publish-generated-changes.sh "chore: reconsultar mercados pré-live pendentes"
          else
            echo "Sem reconsultas novas a gravar."
          fi
