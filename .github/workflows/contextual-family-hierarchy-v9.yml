name: Contextual family hierarchy v9 audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/contextual-family-hierarchy-v9.yml"
      - "scripts/compare_contextual_family_combinations_v9.py"
      - "src/contextual_family_combination_v9.py"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chronological v8 versus v9 replay
        run: >-
          python -m scripts.compare_contextual_family_combinations_v9
          --replay-cache-dir artifacts/contextual-family-replay-v9
          --output artifacts/contextual-family-hierarchy-v9-report.json
          --contract-output artifacts/contextual-family-combination-v9.json
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-family-hierarchy-v9-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
