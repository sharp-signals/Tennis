name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q src tests
      - name: Correr testes unitários
        env:
          LLM_MODE: mock
          LLM_POLICY: selective
          ALLOW_PAID_LLM: "0"
        run: python -m unittest discover -s tests -v
      - name: Correr testes do motor
        env:
          LLM_MODE: mock
          LLM_POLICY: selective
          ALLOW_PAID_LLM: "0"
        run: python tests/test_motor.py
