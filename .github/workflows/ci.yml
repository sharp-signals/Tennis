name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Validar dependências instaladas
        run: pip check
      - name: Validar código
        run: ruff check src tests scripts
      - name: Procurar segredos versionados
        run: python scripts/check_secrets.py
      - name: Auditar vulnerabilidades conhecidas
        run: pip-audit -r requirements.lock
      - name: Correr testes e medir cobertura
        env:
          LLM_MODE: mock
          LLM_POLICY: selective
          ALLOW_PAID_LLM: "0"
        run: |
          coverage run -m unittest discover -s tests -v
          coverage run --append tests/test_motor.py
      - name: Validar cobertura mínima
        run: coverage report
