name: Fenzobot Contextual 2026-11 Observation

on:
  # Sem cron GitHub: o Apps Script despacha às 06:30 e 18:30 Europe/Lisbon.
  workflow_dispatch:
    inputs:
      max_matches:
        description: "Optional safety limit; 0 processes every eligible match"
        required: false
        default: "0"
        type: string
      trigger_slot:
        description: "Slot lógico Europe/Lisbon"
        required: false
        type: string
      trigger_source:
        description: "Origem do dispatch"
        required: false
        type: string
      trigger_local_date:
        description: "Data local do slot"
        required: false
        type: string
      dispatch_attempt_id:
        description: "Identidade idempotente da tentativa"
        required: false
        type: string

concurrency:
  group: tennis-data-writers
  queue: max

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Settle previous global observations and evaluate calibration
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
        run: >-
          python scripts/settle_fenzobot_contextual_2026_11.py
          --max-observations 50

      - name: Collect globally identified contextual observations
        env:
          FENZOBOT_CONTEXTUAL_2026_11_MODE: observe
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        run: >-
          python scripts/run_fenzobot_contextual_2026_11.py
          --max-matches "${{ inputs.max_matches || '0' }}"

      - name: Freeze post-prediction global market benchmark
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          THE_ODDS_API_ENABLED: "1"
          THE_ODDS_API_MAX_COMPETITIONS_PER_RUN: "4"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        run: >-
          python scripts/capture_fenzobot_contextual_market.py
          --max-observations 50

      - name: Refresh global evaluation with new pending observations
        run: >-
          python scripts/settle_fenzobot_contextual_2026_11.py
          --evaluate-only

      - name: Build private global report previews
        run: >-
          python scripts/build_fenzobot_contextual_report_preview.py
          --output-dir "$RUNNER_TEMP/fenzobot-contextual-2026-11-report-preview"
          --max-observations 50

      - name: Upload private global report previews
        uses: actions/upload-artifact@v7
        with:
          name: fenzobot-contextual-2026-11-report-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/fenzobot-contextual-2026-11-report-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Build public contextual reports and notification manifest
        env:
          FENZOBOT_REPORT_NOTIFICATION_MANIFEST: ${{ runner.temp }}/fenzobot-contextual-notifications.json
        run: >-
          python scripts/build_fenzobot_contextual_publication.py
          --max-observations 50

      - name: Update canonical history and workbook
        run: python scripts/build_system_history_workbook.py

      - name: Publish only generated SHADOW data
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar observações FENZOBOT_CONTEXTUAL_2026_11"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: atualizar observações FENZOBOT_CONTEXTUAL_2026_11"
          else
            echo "Sem observações globais novas para publicar."
          fi

      - name: Confirm contextual report publication
        id: contextual_readiness
        continue-on-error: true
        env:
          FENZOBOT_REPORT_NOTIFICATION_MANIFEST: ${{ runner.temp }}/fenzobot-contextual-notifications.json
          REPORT_PUBLICATION_TIMEOUT_SECONDS: "360"
          REPORT_PUBLICATION_POLL_SECONDS: "4"
        run: |
          if [ -f "$FENZOBOT_REPORT_NOTIFICATION_MANIFEST" ]; then
            python -m src.report_notifications wait
          else
            echo "Sem jogos pré-jogo para notificar."
          fi

      - name: Send contextual reports to Telegram
        id: contextual_notifications
        if: steps.contextual_readiness.outcome == 'success'
        continue-on-error: true
        env:
          FENZOBOT_REPORT_NOTIFICATION_MANIFEST: ${{ runner.temp }}/fenzobot-contextual-notifications.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$FENZOBOT_REPORT_NOTIFICATION_MANIFEST" ]; then
            python -m src.report_notifications send
          else
            echo "Sem manifesto contextual; envio não aplicável."
          fi

      - name: Persist contextual delivery checkpoint
        if: always() && steps.contextual_readiness.outcome != 'skipped'
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: registar entrega contextual"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: registar entrega contextual"
          else
            echo "Sem checkpoint contextual novo para publicar."
          fi

      - name: Fail after preserving data if contextual delivery failed
        if: always() && (steps.contextual_readiness.outcome == 'failure' || steps.contextual_notifications.outcome == 'failure')
        run: exit 1

      - name: Preserve generated-data recovery bundle
        if: failure()
        continue-on-error: true
        run: python scripts/recover_generated_outputs.py --profile bot --target "$RUNNER_TEMP/fenzobot-data-recovery" --reason FENZOBOT_CONTEXTUAL_2026_11_WORKFLOW_FAILED

      - name: Upload generated-data recovery bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fenzobot-contextual-2026-11-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fenzobot-data-recovery/
          if-no-files-found: ignore
          retention-days: 30
