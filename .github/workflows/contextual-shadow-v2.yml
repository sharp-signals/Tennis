name: Contextual Shadow V2 Observation

on:
  # Manual only while the operational bot remains paused.
  workflow_dispatch:
    inputs:
      max_matches:
        description: "Optional safety limit; 0 processes every eligible match"
        required: false
        default: "0"
        type: string

concurrency:
  group: tennis-data-writers
  queue: max

jobs:
  observe:
    runs-on: ubuntu-latest
    # A execução normal deve ser bastante mais curta porque não consulta
    # mercados nem produz relatórios. A margem cobre, contudo, calendários
    # extensos e carregamento do histórico sem transformar latência normal
    # num falso timeout.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Collect contextual SHADOW v2 observations
        env:
          CONTEXTUAL_SHADOW_V2_MODE: observe
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        run: >-
          python scripts/run_contextual_shadow_v2.py
          --max-matches "${{ inputs.max_matches || '0' }}"

      - name: Publish only generated SHADOW data
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar observações contextual shadow v2"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: atualizar observações contextual shadow v2"
          else
            echo "Sem observações SHADOW novas para publicar."
          fi
