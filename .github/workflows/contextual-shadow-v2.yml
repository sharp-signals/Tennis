name: Contextual Shadow V2 Observation

on:
  # Manual only while the operational bot remains paused.
  workflow_dispatch:
    inputs:
      max_matches:
        description: "Optional safety limit; 0 processes every eligible match"
        required: false
        default: "0"
        type: string

concurrency:
  group: tennis-data-writers
  queue: max

jobs:
  observe:
    runs-on: ubuntu-latest
    # A execução normal deve ser bastante mais curta porque não consulta
    # mercados nem produz relatórios. A margem cobre, contudo, calendários
    # extensos e carregamento do histórico sem transformar latência normal
    # num falso timeout.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Settle previous SHADOW observations and evaluate calibration
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
        run: python scripts/settle_contextual_shadow_v2.py --max-observations 50

      - name: Collect contextual SHADOW v2 observations
        env:
          CONTEXTUAL_SHADOW_V2_MODE: observe
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        run: >-
          python scripts/run_contextual_shadow_v2.py
          --max-matches "${{ inputs.max_matches || '0' }}"

      - name: Freeze post-prediction market benchmark
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "500"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          THE_ODDS_API_ENABLED: "1"
          THE_ODDS_API_MAX_COMPETITIONS_PER_RUN: "4"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        run: >-
          python scripts/capture_contextual_shadow_market_v2.py
          --max-observations 50

      - name: Refresh SHADOW evaluation with new pending observations
        run: python scripts/settle_contextual_shadow_v2.py --evaluate-only

      - name: Publish only generated SHADOW data
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar observações contextual shadow v2"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: atualizar observações contextual shadow v2"
          else
            echo "Sem observações SHADOW novas para publicar."
          fi

      - name: Preserve generated-data recovery bundle
        if: failure()
        continue-on-error: true
        run: python scripts/recover_generated_outputs.py --profile bot --target "$RUNNER_TEMP/fenzobot-data-recovery" --reason CONTEXTUAL_SHADOW_V2_WORKFLOW_FAILED

      - name: Upload generated-data recovery bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contextual-shadow-v2-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fenzobot-data-recovery/
          if-no-files-found: ignore
          retention-days: 30
