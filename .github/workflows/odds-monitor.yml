name: Odds Movement Monitor

on:
  schedule:
    - cron: "20 5 * * *"
    - cron: "20 11 * * *"
    - cron: "20 17 * * *"
    - cron: "20 23 * * *"
  workflow_dispatch: {}
  # Fallback/event-driven: sempre que o bot principal terminar com sucesso,
  # recolher uma observação de mercado imediatamente depois do novo sinal.
  # Mantemos o schedule independente para continuar a medir movimento depois.
  workflow_run:
    workflows: ["Tennis Pre-Live Bot"]
    types: [completed]

concurrency:
  group: tennis-pre-live-production
  cancel-in-progress: false

jobs:
  monitor-odds:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Recolher movimento de odds SHADOW
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "400"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
          ODDS_MONITOR_MARKET_ID: "1"
          ODDS_MONITOR_HORIZON_HOURS: "48"
          ODDS_MONITOR_FRESH_MAX_AGE_SECONDS: "900"
          ODDS_MONITOR_TRIGGER: ${{ github.event_name }}
          ODDS_MONITOR_GITHUB_RUN_ID: ${{ github.run_id }}
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
        # -m mantém a raiz do repositório no caminho de importação, para que
        # o monitor possa importar ``src.fetch_data`` no runner do GitHub.
        run: python -m scripts.odds_monitor

      - name: Persistir observações e telemetria
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/odds_monitor/ data/rapidapi_usage_log.json 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: atualizar histórico SHADOW de odds [skip ci]"
            git pull --rebase --autostash origin main
            bash scripts/publish-generated-changes.sh "chore: atualizar histórico SHADOW de odds"
          else
            echo "Sem novas observações de odds a persistir."
          fi
