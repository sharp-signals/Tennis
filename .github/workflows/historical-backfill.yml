name: Historical Replay Warehouse

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, controlled pilot, explicit backfill, or offline replay
        type: choice
        options: [audit, pilot, backfill, replay]
        default: audit
      tour:
        description: Circuit
        type: choice
        options: [both, atp, wta]
        default: both
      year_from:
        description: Reserved filter for a later source-proven capability
        default: "2018"
      year_to:
        description: Reserved filter for a later source-proven capability
        default: "2026"
      max_matches:
        description: Maximum normalized/replayed matches
        default: "20"
      max_calls:
        description: Maximum calls requested by this controlled run
        default: "8"
      resume:
        description: Skip completed acquisition items
        type: boolean
        default: true
      confirm_backfill:
        description: For backfill only, enter I_UNDERSTAND_THE_QUOTA
        default: ""

concurrency:
  group: tennis-pre-live-production
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LLM_MODE: disabled
      LLM_POLICY: never
      ALLOW_PAID_LLM: "0"
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      RAPIDAPI_MAX_CALLS_PER_RUN: ${{ inputs.max_calls }}
      RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
      RAPIDAPI_OPERATIONAL_RESERVE: "1500"
      RAPIDAPI_BACKFILL_GLOBAL_CEILING: "3000"
      HISTORICAL_WAREHOUSE_PATH: data/historical_warehouse/sharp_history.sqlite3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock

      - name: Capability audit
        if: inputs.mode == 'audit'
        env:
          MAX_CALLS_INPUT: ${{ inputs.max_calls }}
        run: python -m scripts.historical_capability_audit --max-calls "$MAX_CALLS_INPUT" --output-dir artifacts/historical-audit

      - name: Controlled acquisition
        if: inputs.mode == 'pilot' || inputs.mode == 'backfill'
        shell: bash
        env:
          MODE_INPUT: ${{ inputs.mode }}
          TOUR_INPUT: ${{ inputs.tour }}
          MAX_MATCHES_INPUT: ${{ inputs.max_matches }}
          MAX_CALLS_INPUT: ${{ inputs.max_calls }}
          RESUME_INPUT: ${{ inputs.resume }}
          CONFIRM_INPUT: ${{ inputs.confirm_backfill }}
        run: |
          extra=()
          if [[ "$RESUME_INPUT" == "false" ]]; then extra+=(--no-resume); fi
          if [[ "$MODE_INPUT" == "backfill" ]]; then
            extra+=(--confirm-backfill "$CONFIRM_INPUT")
          fi
          python -m scripts.historical_replay "$MODE_INPUT" \
            --tour "$TOUR_INPUT" --max-matches "$MAX_MATCHES_INPUT" \
            --max-calls "$MAX_CALLS_INPUT" "${extra[@]}"

      - name: Offline replay
        if: inputs.mode == 'replay'
        env:
          TOUR_INPUT: ${{ inputs.tour }}
          MAX_MATCHES_INPUT: ${{ inputs.max_matches }}
        run: python -m scripts.historical_replay replay --tour "$TOUR_INPUT" --max-matches "$MAX_MATCHES_INPUT"

      - name: Upload audit/pilot artefacts (ephemeral warehouse, not durable storage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            artifacts/historical-audit/
            data/historical_warehouse/*.sqlite3
          if-no-files-found: ignore
          retention-days: 7
