name: Audit contextual primary dominant consensus

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Restaurar replay cronológico
        uses: actions/cache@v4
        with:
          path: .tmp/contextual-rating-replay
          key: contextual-rating-replay-v9-${{ hashFiles('src/contextual_family_replay.py', 'src/contextual_family_methodology.py') }}
      - name: Instalar dependências
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Confirmar replay existente
        run: |
          test -f .tmp/contextual-rating-replay/atp.jsonl.gz
          test -f .tmp/contextual-rating-replay/wta.jsonl.gz
      - name: Testar interação principal dominante
        run: |
          python -m scripts.audit_contextual_primary_dominant_consensus \
            --model data/models/fenzobot-contextual-2026-11.json \
            --replay-input-dir .tmp/contextual-rating-replay \
            --output .tmp/contextual-primary-dominant-consensus-v1.json
      - name: Testes específicos
        run: |
          python -m unittest \
            tests.test_audit_contextual_primary_dominant_consensus \
            tests.test_audit_contextual_low_consensus_candidates -v
          ruff check \
            scripts/audit_contextual_primary_dominant_consensus.py \
            scripts/audit_contextual_low_consensus_candidates.py \
            tests/test_audit_contextual_primary_dominant_consensus.py \
            tests/test_audit_contextual_low_consensus_candidates.py
      - name: Guardar comparação exploratória
        uses: actions/upload-artifact@v7
        with:
          name: contextual-primary-dominant-consensus-v1
          path: .tmp/contextual-primary-dominant-consensus-v1.json
          if-no-files-found: error
