name: CHANGE030 offline validation (temporary)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'change/CHANGE-2026-09-08-030-audit-remediation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_MODE: mock
      LLM_POLICY: selective
      ALLOW_PAID_LLM: '0'
      THE_ODDS_API_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: change/CHANGE-2026-09-08-030-audit-remediation
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Synchronize only the review branch
        run: |
          git config user.name 'fenzobot-change030'
          git config user.email 'actions@github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python scripts/_apply_change030.py
          python - <<'PY'
          from pathlib import Path
          edits = {
              'src/report_html.py': [('Sharp adjustment</span>', 'Fenzobot adjustment</span>'), ('estimativa Sharp</div>', 'estimativa Fenzobot</div>')],
              'tests/test_pricing.py': [('"Sharp estimate"', '"Fenzobot estimate"'), ('"Fiabilidade das fontes"', '"Coeficiente de fonte (pricing)"')],
          }
          for filename, replacements in edits.items():
              path = Path(filename)
              content = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  assert old in content, (filename, old)
                  content = content.replace(old, new)
              path.write_text(content, encoding='utf-8')
          PY
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Full offline validation and continuity
        run: |
          set -o pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          python scripts/check_secrets.py
          node --test scripts/google_apps_script/sync_paper_22bet.test.js | tee "$RUNNER_TEMP/node-tests.log"
          coverage run -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/python-tests.log"
          coverage run --append tests/test_motor.py 2>&1 | tee "$RUNNER_TEMP/motor-tests.log"
          coverage report | tee "$RUNNER_TEMP/coverage.log"
          python -m scripts.check_metric_continuity --baseline-ref origin/main | tee "$RUNNER_TEMP/continuity-before.json"
          python -m scripts.refresh_observability | tee "$RUNNER_TEMP/refresh.json"
          python -m scripts.check_metric_continuity --baseline-ref origin/main | tee "$RUNNER_TEMP/continuity-after.json"
          git diff --exit-code -- data/calibration_snapshots.json data/paper_trades.json data/manual_paper_22bet.json data/market_ledger/observations/ data/market_ledger/archive/ docs/relatorios/
          git diff --check
      - name: Publish source only within the runner contents permission
        run: |
          # Workflow edits are published separately through the authorised connector.
          cp .github/workflows/odds-monitor.yml "$RUNNER_TEMP/odds-monitor.approved.yml"
          git restore --source=HEAD -- .github/workflows/
          git rm scripts/_apply_change030.py
          git add src/ tests/ scripts/ README.md docs/AUDIT_METRIC_CONTINUITY.md data/dashboard/ docs/dashboard/ data/validation/ data/market_ledger/derived/
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing workflow publication with the contents-only runner token'
            exit 1
          fi
          git commit -m 'CHANGE-2026-09-08-030: implement audit remediation with metric parity'
          git archive --format=tar HEAD > "$RUNNER_TEMP/change030-reviewed-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/validated-commit.txt"
          git rev-parse origin/main > "$RUNNER_TEMP/validated-base.txt"
          git push origin HEAD:change/CHANGE-2026-09-08-030-audit-remediation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: change030-validation
          path: |
            ${{ runner.temp }}/*-tests.log
            ${{ runner.temp }}/coverage.log
            ${{ runner.temp }}/continuity-*.json
            ${{ runner.temp }}/refresh.json
            ${{ runner.temp }}/change030-reviewed-source.tar
            ${{ runner.temp }}/odds-monitor.approved.yml
            ${{ runner.temp }}/validated-*.txt
          retention-days: 7
