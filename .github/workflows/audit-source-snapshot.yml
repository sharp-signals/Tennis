name: Audit source snapshot (temporary)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'change/CHANGE-2026-09-08-030-audit-remediation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked public source for offline parity review
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/fenzobot-audit-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: fenzobot-audit-source
          path: ${{ runner.temp }}/fenzobot-audit-source.tar
          retention-days: 1
          if-no-files-found: error
