name: Audit serve-return indoor/outdoor

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Restaurar histórico canónico
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: data/provider_cache/tennismylife
          key: tennismylife-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tennismylife-v1-${{ runner.os }}-

      - name: Restaurar replay cronológico
        uses: actions/cache@v4
        with:
          path: .tmp/contextual-rating-replay
          key: contextual-rating-replay-v9-${{ hashFiles('src/contextual_family_replay.py', 'src/contextual_family_methodology.py') }}

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Construir replay apenas se a cache faltar
        run: |
          if [ ! -f .tmp/contextual-rating-replay/atp.jsonl.gz ] || [ ! -f .tmp/contextual-rating-replay/wta.jsonl.gz ]; then
            python -m scripts.compare_contextual_family_combinations_v5 \
              --provider-cache data/provider_cache/tennismylife \
              --replay-cache-dir .tmp/contextual-rating-replay \
              --output .tmp/replay-audit.json
          fi

      - name: Auditar serviço e resposta por contexto exato
        env:
          VALUEBETENNIS_NETWORK_REFRESH: "0"
          TENNISDATA_NETWORK_REFRESH: "0"
        run: |
          python -m scripts.audit_serve_return_exact_context_v2 \
            --replay-input-dir .tmp/contextual-rating-replay \
            --provider-cache data/provider_cache/tennismylife \
            --output .tmp/serve-return-exact-context-audit-v2.json

      - name: Guardar auditoria
        uses: actions/upload-artifact@v7
        with:
          name: serve-return-exact-context-audit-v2
          path: .tmp/serve-return-exact-context-audit-v2.json
          if-no-files-found: error
