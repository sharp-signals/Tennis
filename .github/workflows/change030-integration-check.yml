name: CHANGE030 integration check (temporary)
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
concurrency:
  group: change030-integration-check
  cancel-in-progress: false
jobs:
  integrate:
    if: github.event.pull_request.number == 120 && github.head_ref == 'change/CHANGE-2026-09-08-030-audit-remediation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 948895fb780621b95c489f3c908c73649ac0c0e2
      REVIEWED_HEAD: e3979f51523b2d7a605746efc5c930af4247efbc
      LLM_MODE: mock
      LLM_POLICY: selective
      ALLOW_PAID_LLM: '0'
      THE_ODDS_API_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Pin reviewed parents and integrate only PR120
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git config user.name 'fenzobot-change030'
          git config user.email 'actions@github.com'
          git switch -c change030-reviewed-integration
          git merge --no-commit --no-ff "$BASE" || test "$(git diff --name-only --diff-filter=U)" = 'src/report_html.py'
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          def read(ref):
              return subprocess.check_output(['git', 'show', ref + ':src/report_html.py'], text=True)
          def split(source):
              start = source.index('\ndef _mod_decision_box(')
              end = source.index('\ndef _mod_green_strong_candidate(', start)
              return source[:start], source[start:end], source[end:]
          ours = split(read(os.environ['REVIEWED_HEAD']))
          theirs = split(read(os.environ['BASE']))
          ancestor_ref = subprocess.check_output(['git', 'merge-base', os.environ['BASE'], os.environ['REVIEWED_HEAD']], text=True).strip()
          ancestor = split(read(ancestor_ref))
          assert (theirs[0], theirs[2]) == (ancestor[0], ancestor[2]), 'Unreviewed PR121 report changes'
          assert ours[1] == ancestor[1].replace('Cobertura <b>', 'Cobertura ponderada operacional <b>'), 'Unreviewed PR120 decision-box changes'
          assert theirs[1].count('Cobertura <b>') == 1
          merged_function = theirs[1].replace('Cobertura <b>', 'Cobertura ponderada operacional <b>')
          Path('src/report_html.py').write_text(ours[0] + merged_function + ours[2], encoding='utf-8')
          note = '''# CHANGE-2026-09-08-030 — integração e desambiguação de âmbito

          Estado: validação funcional confirmada pelo utilizador em 08/09/2026; integração na branch da PR #120, sem merge em main.

          ## Rastreabilidade da colisão de identificador

          Foram observados dois trabalhos distintos com o mesmo CHANGE-ID. Esta nota preserva ambos e usa a PR e os commits para identificar inequivocamente cada âmbito; não renomeia branches, commits, métricas ou registos históricos.

          | Referência inequívoca | Âmbito | Evidência histórica |
          |---|---|---|
          | CHANGE-2026-09-08-030 / PR #120 | Auditoria, observabilidade, continuidade de métricas e apresentação | Head funcional aprovado e3979f51523b2d7a605746efc5c930af4247efbc; permanece sem merge nesta integração |
          | CHANGE-2026-09-08-030 / PR #121 | Aliases auditados de eventos de odds e diagnósticos | Merge em main 948895fb780621b95c489f3c908c73649ac0c0e2, em 08/09/2026 |

          O âmbito da PR #121 não é atribuído à PR #120. O identificador isolado é ambíguo neste caso; as referências acima mantêm o audit trail sem escolher retroativamente um novo CHANGE-ID.

          ## Integração

          Base combinada: main 948895fb780621b95c489f3c908c73649ac0c0e2.
          Preservar integralmente fetch_data.py, main.py e os testes de aliases da base. Em report_html.py, manter os diagnósticos da PR #121 e a identificação de cobertura operacional da PR #120. Nenhuma nova regra de pricing, seleção, aquisição ou classificação é introduzida.

          ## Gate de entrega

          Suite Python e motor, Node, lint, compileall, pesquisa de segredos, paridade das métricas legacy antes/depois do refresh e igualdade dos dados primários contra a base. O workflow só publica a integração na branch se todos estes gates passarem. A revisão/merge em main e a verificação da publicação permanecem passos separados.
          '''
          note = '\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines()) + '\n'
          Path('docs/changes/CHANGE-2026-09-08-030-INTEGRATION.md').write_text(note, encoding='utf-8')
          test = '''"""Regression guard for the approved PR120/PR121 integration."""
          import copy
          import unittest
          from src import report_html


          class AuditIntegrationTests(unittest.TestCase):
              def test_pr121_diagnostic_remains_visible_without_mutating_decision(self):
                  payload = {"prelive_decision": {
                      "state": "PRICING_UNAVAILABLE",
                      "reason": "event_identity_unavailable",
                      "coverage": {"weighted_pct": 85.4, "status": "reduzida"},
                  }}
                  original = copy.deepcopy(payload)
                  html = report_html._mod_decision_box(payload)
                  self.assertIn("associado com segurança aos dois jogadores", html)
                  self.assertIn("edge e PAPER bloqueados", html)
                  self.assertEqual(payload, original)

              def test_pr120_operational_coverage_remains_explicit(self):
                  payload = {"prelive_decision": {
                      "state": "EDGE_POSITIVE", "player": "A",
                      "fenzobot_index": 80, "expected_edge_pct": 2.0,
                      "market": {"market": "Moneyline A", "odd": 1.8},
                      "coverage": {"weighted_pct": 85.4, "status": "reduzida"},
                  }}
                  original = copy.deepcopy(payload)
                  html = report_html._mod_decision_box(payload)
                  self.assertIn("Cobertura ponderada operacional", html)
                  self.assertIn("Entrada PAPER automática", html)
                  self.assertEqual(payload, original)
          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          Path('tests/test_audit_integration.py').write_text(test, encoding='utf-8')
          PY
          git add src/report_html.py docs/changes/CHANGE-2026-09-08-030-INTEGRATION.md tests/test_audit_integration.py
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Validate combined code and unchanged primary data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/change030-integration"
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          python scripts/check_secrets.py
          pip check
          node --test scripts/google_apps_script/sync_paper_22bet.test.js > "$RUNNER_TEMP/change030-integration/node-tests.log" 2>&1
          coverage run -m unittest discover -s tests -q > "$RUNNER_TEMP/change030-integration/python-tests.log" 2>&1
          coverage run --append tests/test_motor.py > "$RUNNER_TEMP/change030-integration/motor-tests.log" 2>&1
          coverage report > "$RUNNER_TEMP/change030-integration/coverage.log"
          python -m scripts.check_metric_continuity --baseline-ref "$BASE" | tee "$RUNNER_TEMP/change030-integration/continuity-before.json"
          python -m scripts.refresh_observability | tee "$RUNNER_TEMP/change030-integration/refresh.json"
          python -m scripts.check_metric_continuity --baseline-ref "$BASE" | tee "$RUNNER_TEMP/change030-integration/continuity-after.json"
          git diff --exit-code "$BASE" -- src/fetch_data.py src/main.py tests/test_data_transforms.py data/calibration_snapshots.json data/paper_trades.json data/manual_paper_22bet.json data/market_ledger/observations/ data/market_ledger/archive/ docs/relatorios/
          git diff --check
          git diff --cached --check
          echo "$BASE" > "$RUNNER_TEMP/change030-integration/validated-base.txt"
      - name: Save integration to PR120 only
        run: |
          set -euo pipefail
          git add data/dashboard/ docs/dashboard/ data/market_ledger/derived/ data/validation/
          git commit -m 'CHANGE-2026-09-08-030 / PR120: integrate PR121 preserving aliases and metric parity'
          git push origin HEAD:change/CHANGE-2026-09-08-030-audit-remediation
          git rev-parse HEAD > "$RUNNER_TEMP/change030-integration/validated-head.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/change030-integration/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: change030-integration-validation
          path: ${{ runner.temp }}/change030-integration/
          retention-days: 7
