name: Settlement Recovery

on:
  workflow_dispatch:
    inputs:
      through_date:
        description: "Liquidar apenas jogos iniciados até esta data UTC (YYYY-MM-DD)"
        required: true
        default: "2026-10-06"
        type: string

concurrency:
  group: tennis-data-writers
  queue: max

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Recuperar resultados confirmados sem analisar mercados
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SETTLEMENT_THROUGH_DATE: ${{ inputs.through_date }}
          SETTLEMENT_BATCH_SIZE: "1000"
          RESULT_RECOVERY_PLAYER_BATCH: "400"
          SETTLEMENT_DEADLINE_SECONDS: "1080"
          SETTLEMENT_HARD_TIMEOUT_SECONDS: "1200"
        run: python scripts/run_settlement_maintenance.py

      - name: Atualizar histórico canónico e Excel
        if: always()
        run: python scripts/build_system_history_workbook.py

      - name: Publicar apenas resultados e vistas derivadas
        if: always()
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: recuperar resultados pendentes [skip ci]"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: recuperar resultados pendentes"
          else
            echo "Sem resultados novos para publicar."
