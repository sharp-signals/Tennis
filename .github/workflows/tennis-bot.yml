name: Tennis Pre-Live Bot

on:
  schedule:
    # 05:30/17:30 UTC = 06:30/18:30 em Portugal durante o horário de verão.
    - cron: "30 5 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}   # mantém também a execução manual pela UI

concurrency:
  group: tennis-pre-live-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # necessário para o commit automático da cache de torneios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Correr o bot
        env:
          LLM_MODE: anthropic
          LLM_POLICY: selective
          ALLOW_PAID_LLM: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_EMAIL_TO: fenzobot@gmail.com
          REPORT_EMAIL_FROM: fenzobot@gmail.com
          REPORT_EMAIL_APP_PASSWORD: ${{ secrets.REPORT_EMAIL_APP_PASSWORD }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "2250"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
        run: python -m src.main

      - name: Atualizar resultados para calibracao
        if: success()
        run: python scripts/update_calibration_outcomes.py

      # Corre mesmo quando o Python falha ou é interrompido. Publica apenas
      # telemetria; nunca inclui docs/, evitando relatórios parciais.
      - name: Preservar telemetria se o bot falhar
        if: failure()
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/rapidapi_usage_log.json data/rapidapi_usage_inflight.json \
            data/run_metrics_log.json 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: preservar telemetria de execução falhada [skip ci]"
            git pull --rebase --autostash origin main
            bash scripts/publish-generated-changes.sh "chore: preservar telemetria de execução falhada"
          else
            echo "Sem telemetria nova para preservar."
          fi

      - name: Gravar caches + relatórios do site, se mudaram
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/analysis_cache/ data/cache/ data/fixtures_cache.json \
            data/tournament_cache.json data/rapidapi_usage_log.json \
            data/run_metrics_log.json data/calibration_snapshots.json \
            data/paper_trades.json \
            data/player_images.json data/player_images_review.json \
            knowledge/players/ docs/ 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: atualizar caches e relatórios"
            bash scripts/publish-generated-changes.sh "chore: atualizar caches e relatórios"
          else
            echo "Sem alterações a gravar."
          fi

      - name: Alertar no Telegram se alguma coisa falhou
        if: failure()
        run: |
          curl --fail-with-body --show-error --silent --retry 2 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ O Tennis Pre-Live Bot falhou nesta execução (${{ github.run_id }}). Vê os logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        continue-on-error: true
