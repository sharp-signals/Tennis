name: Tennis Pre-Live Bot

on:
  # O agendamento é feito pelo Google Apps Script, que dispara este workflow
  # por ``workflow_dispatch`` às 06:30, 11:30, 15:30 e 18:30 Europe/Lisbon.
  # O script de referência está em scripts/google_apps_script/prelive_scheduler.gs.
  # O cron nativo
  # do GitHub pode arrancar horas atrasado, portanto fica deliberadamente
  # desativado para não criar execuções inesperadas nem custo extra.
  workflow_dispatch:
    inputs:
      trigger_slot:
        description: "Slot lógico do scheduler (ex.: 11:30)"
        required: false
        type: string
      trigger_source:
        description: "Origem do dispatch"
        required: false
        type: string
      trigger_local_date:
        description: "Data local Europe/Lisbon do slot (YYYY-MM-DD)"
        required: false
        type: string
      dispatch_attempt_id:
        description: "Identidade idempotente da tentativa de dispatch"
        required: false
        type: string

concurrency:
  group: tennis-data-writers
  queue: max

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # necessário para o commit automático da cache de torneios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Reruns da mesma workflow run recuperam checkpoints já publicados.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Configurar manifesto temporário
        run: |
          echo "FENZOBOT_REPORT_NOTIFICATION_MANIFEST=$RUNNER_TEMP/fenzobot-report-notifications.json" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Correr o bot
        id: run_bot
        env:
          # CHANGE-2026-08-31-017: nesta fase o motor e os relatórios são
          # determinísticos; Claude não é necessário para decidir PAPER.
          # Mantemos o secret fora do job para impedir qualquer custo acidental.
          LLM_MODE: disabled
          LLM_POLICY: never
          ALLOW_PAID_LLM: "0"
          FENZOBOT_TRIGGER_SLOT: ${{ inputs.trigger_slot || 'manual' }}
          FENZOBOT_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          FENZOBOT_TRIGGER_LOCAL_DATE: ${{ inputs.trigger_local_date || 'manual' }}
          FENZOBOT_DISPATCH_ATTEMPT_ID: ${{ inputs.dispatch_attempt_id || github.run_id }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # CHANGE-2026-10-02-070: só uma quote independente, fresca e com
          # timestamp de bookmaker pode decidir pricing/edge/PAPER. A consulta
          # é uma vez por competição publicada, nunca por jogador.
          THE_ODDS_API_ENABLED: "1"
          THE_ODDS_API_MAX_COMPETITIONS_PER_RUN: "3"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_EMAIL_TO: fenzobot@gmail.com
          REPORT_EMAIL_FROM: fenzobot@gmail.com
          REPORT_EMAIL_APP_PASSWORD: ${{ secrets.REPORT_EMAIL_APP_PASSWORD }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "2250"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
        run: python -m src.main

      # CHANGE-058/PR #167: publicar antes de qualquer manutenção posterior.
      # CHANGE-059: o bot já não envia links; readiness e envio vêm abaixo.
      - name: Publicar relatórios do site imediatamente
        id: publish_reports
        if: steps.run_bot.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          # O perfil bot inclui explicitamente data/run_metrics_log.json.
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: publicar relatórios gerados"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: publicar relatórios gerados"
          else
            echo "Sem relatórios novos para publicar."
          fi

      - name: Confirmar publicação dos relatórios
        id: report_readiness
        if: steps.run_bot.outcome == 'success' && steps.publish_reports.outcome == 'success'
        continue-on-error: true
        env:
          REPORT_PUBLICATION_TIMEOUT_SECONDS: "120"
          REPORT_PUBLICATION_POLL_SECONDS: "4"
        run: python -m src.report_notifications wait

      - name: Enviar notificações dos relatórios
        id: report_notifications
        if: steps.run_bot.outcome == 'success' && steps.publish_reports.outcome == 'success' && steps.report_readiness.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_EMAIL_TO: fenzobot@gmail.com
          REPORT_EMAIL_FROM: fenzobot@gmail.com
          REPORT_EMAIL_APP_PASSWORD: ${{ secrets.REPORT_EMAIL_APP_PASSWORD }}
        run: python -m src.report_notifications send

      - name: Reter notificações se o push falhou
        if: always() && steps.run_bot.outcome == 'success' && steps.publish_reports.outcome == 'failure'
        env:
          FENZOBOT_RUN_METRICS_PATH: data/run_metrics_log.json
        run: python -m src.report_notifications withhold --reason REPORT_PUBLICATION_PUSH_FAILED

      - name: Atualizar resultados para calibracao
        id: settlement_maintenance
        if: steps.run_bot.outcome == 'success' && steps.publish_reports.outcome == 'success' && steps.report_readiness.outcome == 'success' && steps.report_notifications.outcome == 'success'
        continue-on-error: true
        env:
          # Após a filtragem canónica pela dupla de jogadores, este lote cobre
          # a fila corrente numa run sem alterar aquisição ou pricing.
          SETTLEMENT_BATCH_SIZE: "500"
          SETTLEMENT_DEADLINE_SECONDS: "150"
          FENZOBOT_RUN_METRICS_PATH: data/run_metrics_log.json
        run: python scripts/run_settlement_maintenance.py

      - name: Resumir manutenção persistida
        if: always() && steps.settlement_maintenance.outcome != 'skipped'
        run: |
          python -c "import json,pathlib; p=pathlib.Path('data/maintenance/settlement-v1.json'); d=json.loads(p.read_text()) if p.exists() else {}; r=d.get('last_run',{}); print('### Settlement maintenance\n\nStatus: **'+str(r.get('status','UNAVAILABLE'))+'**\n\nReason: '+str(r.get('reason_code','—')))" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.settlement_maintenance.outcome }}" = "failure" ]; then
            echo "::warning::Settlement maintenance terminou com alerta; o checkpoint foi persistido."
          fi

      # CHANGE-2026-09-28-061: reconstrói um livro Excel e o JSON que lhe dá
      # origem a partir de snapshots imutáveis. Não faz requests externas e
      # exclui versões repetidas de HTML das métricas analíticas.
      - name: Atualizar histórico canónico e Excel
        if: steps.run_bot.outcome == 'success'
        run: python scripts/build_system_history_workbook.py

      # Corre mesmo quando o Python falha ou é interrompido. Publica apenas
      # telemetria e dashboard derivado; nunca inclui relatórios parciais.
      - name: Preservar telemetria se o bot falhar
        if: steps.run_bot.outcome == 'failure'
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          # O perfil bot inclui data/match_identity/ no estado recuperável.
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: preservar telemetria de execução falhada [skip ci]"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: preservar telemetria de execução falhada"
          else
            echo "Sem telemetria nova para preservar."
          fi

      - name: Gravar caches + relatórios do site, se mudaram
        if: always() && steps.run_bot.outcome == 'success'
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          # O perfil bot inclui explicitamente data/run_metrics_log.json.
          # Inclui também data/match_identity/ sem staging implícito.
          python scripts/stage_generated_outputs.py --profile bot
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar caches e relatórios"
            FENZOBOT_WRITER_PROFILE=bot bash scripts/publish-generated-changes.sh "chore: atualizar caches e relatórios"
          else
            echo "Sem alterações a gravar."
          fi

      - name: Falhar após preservar dados se publicação ou notificação falhou
        if: always() && steps.run_bot.outcome == 'success' && (steps.publish_reports.outcome == 'failure' || steps.report_readiness.outcome == 'failure' || steps.report_notifications.outcome == 'failure')
        run: |
          if [ "${{ steps.report_readiness.outcome }}" = "failure" ]; then
            echo "REPORT_PUBLICATION_TIMEOUT"
          fi
          exit 1

      - name: Preservar recuperação de publicação
        if: failure()
        continue-on-error: true
        run: python scripts/recover_generated_outputs.py --profile bot --target "$RUNNER_TEMP/fenzobot-data-recovery" --reason WORKFLOW_FAILED_BEFORE_OR_DURING_PUBLICATION

      - name: Carregar recuperação de publicação
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: data-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fenzobot-data-recovery/
          if-no-files-found: ignore
          retention-days: 30

      - name: Alertar no Telegram se alguma coisa falhou
        if: failure()
        run: |
          curl --fail-with-body --show-error --silent --retry 2 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ O Tennis Pre-Live Bot falhou nesta execução (${{ github.run_id }}). Vê os logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        continue-on-error: true
