name: Tennis Pre-Live Bot

on:
  # SCHEDULE AUTOMÁTICO DESATIVADO durante a fase de testes (30/07/2026).
  # Passou a 1x/dia às 05:00 UTC (~6h Portugal) — apanha o dia inteiro de
  # jogos graças à janela alargada (LOOKAHEAD 0-36h no config). Correr 1x
  # em vez de 2x reduz a metade o custo Anthropic e as chamadas RapidAPI.
  # Para REATIVAR quando o projeto estiver estável, descomenta as 2 linhas
  # (schedule + cron) abaixo.
  # schedule:
  #   - cron: "0 5 * * *"   # 05:00 UTC = ~06:00 Portugal (verão)
  workflow_dispatch: {}   # correr manualmente a partir do GitHub UI (único trigger ativo)

concurrency:
  group: tennis-pre-live-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # necessário para o commit automático da cache de torneios
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Correr o bot
        env:
          LLM_MODE: anthropic
          LLM_POLICY: selective
          ALLOW_PAID_LLM: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          RAPIDAPI_MAX_CALLS_PER_RUN: "800"
          RAPIDAPI_MAX_CALLS_PER_DAY: "4500"
        run: python -m src.main

      # Corre mesmo quando o Python falha ou é interrompido. Publica apenas
      # telemetria; nunca inclui docs/, evitando relatórios parciais.
      - name: Preservar telemetria se o bot falhar
        if: failure()
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/rapidapi_usage_log.json data/rapidapi_usage_inflight.json \
            data/run_metrics_log.json 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: preservar telemetria de execução falhada [skip ci]"
            git pull --rebase --autostash origin main
            bash scripts/publish-generated-changes.sh "chore: preservar telemetria de execução falhada"
          else
            echo "Sem telemetria nova para preservar."
          fi

      - name: Gravar caches + relatórios do site, se mudaram
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/analysis_cache/ data/cache/ data/fixtures_cache.json \
            data/tournament_cache.json data/rapidapi_usage_log.json \
            data/run_metrics_log.json docs/ 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: atualizar caches e relatórios"
            # Integrar mudanças remotas antes de enviar (evita o erro
            # "! [rejected] ... fetch first" quando o repo avançou entretanto,
            # ex: substituições manuais de ficheiros). Rebase por cima do
            # remoto e tenta o push; se ainda falhar, repete.
            push_ok=0
            for tentativa in 1 2 3; do
              if ! git pull --rebase --autostash origin main; then
                echo "Rebase falhou; não é seguro continuar para push."
                exit 1
              fi
              if bash scripts/publish-generated-changes.sh "chore: atualizar caches e relatórios"; then
                echo "Push concluído (tentativa $tentativa)."
                push_ok=1
                break
              fi
              echo "Push falhou na tentativa $tentativa; a repetir..."
              sleep 3
            done
            # AUDITORIA P1: se as 3 tentativas falharam, falhar o workflow
            # explicitamente para o alerta do Telegram (if: failure()) disparar.
            # Sem isto, o push podia falhar em silêncio e ninguém saberia.
            if [ "$push_ok" -ne 1 ]; then
              echo "Push falhou definitivamente após 3 tentativas."
              exit 1
            fi
          else
            echo "Sem alterações a gravar."
          fi


      - name: Alertar no Telegram se alguma coisa falhou
        if: failure()
        run: |
          curl --fail-with-body --show-error --silent --retry 2 -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ O Tennis Pre-Live Bot falhou nesta execução (${{ github.run_id }}). Vê os logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        continue-on-error: true
