name: Tennis Pre-Live Bot

on:
  # SCHEDULE AUTOMÁTICO DESATIVADO durante a fase de testes (30/07/2026)
  # — para não competir com os testes manuais pela quota da RapidAPI.
  # Para REATIVAR quando o projeto estiver estável, descomenta as 2 linhas
  # cron abaixo.
  # schedule:
  #   # Corre duas vezes por dia (horas em UTC).
  #   # 07:00 UTC ~= manhã na Europa -> apanha jogos "hoje" que arrancam à tarde/noite
  #   # 18:00 UTC ~= fim da tarde na Europa -> apanha véspera de jogos de amanhã de manhã
  #   - cron: "0 7 * * *"
  #   - cron: "0 18 * * *"
  workflow_dispatch: {}   # correr manualmente a partir do GitHub UI (único trigger ativo)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # necessário para o commit automático da cache de torneios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Correr o bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
        run: python -m src.main

      - name: Gravar caches + relatórios do site, se mudaram
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          git add data/ docs/ 2>/dev/null || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
            git commit -m "chore: atualizar caches e relatórios [skip ci]"
            git push
          else
            echo "Sem alterações a gravar."
          fi


      - name: Alertar no Telegram se alguma coisa falhou
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ O Tennis Pre-Live Bot falhou nesta execução (${{ github.run_id }}). Vê os logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        continue-on-error: true
