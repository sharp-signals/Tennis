name: Build Player Profile Catalog

on:
  workflow_dispatch:
    inputs:
      tour:
        description: Circuito a gerar
        required: true
        default: both
        type: choice
        options: [both, atp, wta]
      active_days:
        description: Janela de atividade em dias
        required: true
        default: "730"
      max_players:
        description: Limite por circuito; 0 gera todos
        required: true
        default: "0"

concurrency:
  group: tennis-data-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Restaurar histórico canónico
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: data/provider_cache/tennismylife
          key: tennismylife-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tennismylife-v1-${{ runner.os }}-

      - name: Instalar dependências
        run: pip install -r requirements.lock

      - name: Gerar fichas e catálogo
        env:
          TENNISMYLIFE_CACHE_DIR: data/provider_cache/tennismylife
          VALUEBETENNIS_NETWORK_REFRESH: "0"
          TENNISDATA_NETWORK_REFRESH: "0"
        run: >-
          python -m src.generate_player_profile_catalog
          --tour "${{ inputs.tour }}"
          --active-days "${{ inputs.active_days }}"
          --max-players "${{ inputs.max_players }}"

      - name: Validar catálogo produzido
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("data/player_profiles/v2/index.json").read_text(encoding="utf-8"))
          players = index.get("players") or []
          summary = json.loads(Path("data/player_profiles/v2/generation-summary.json").read_text(encoding="utf-8"))
          if not players:
              raise SystemExit("PLAYER_PROFILE_CATALOG_EMPTY")
          skipped = sum((summary.get("skipped") or {}).values())
          if skipped:
              raise SystemExit(f"PLAYER_PROFILE_CATALOG_SKIPPED:{skipped}")
          if not Path("docs/jogadores/index.html").exists():
              raise SystemExit("PLAYER_PROFILE_CATALOG_HTML_MISSING")
          print(f"catalog_players={len(players)}")
          PY

      - name: Publicar catálogo
        run: |
          git config user.name "tennis-bot"
          git config user.email "actions@github.com"
          python scripts/stage_generated_outputs.py --profile player-profiles
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar catálogo de jogadores [skip ci]"
            FENZOBOT_WRITER_PROFILE=player-profiles bash scripts/publish-generated-changes.sh "chore: atualizar catálogo de jogadores"
          fi

      - name: Preservar recuperação de publicação
        if: failure()
        continue-on-error: true
        run: python scripts/recover_generated_outputs.py --profile player-profiles --target "$RUNNER_TEMP/fenzobot-data-recovery" --reason PLAYER_PROFILE_CATALOG_FAILED

      - name: Carregar recuperação de publicação
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: player-profile-catalog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fenzobot-data-recovery/
          if-no-files-found: ignore
          retention-days: 30
