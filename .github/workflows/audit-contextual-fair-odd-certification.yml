name: Audit contextual fair odd certification

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Restaurar replay cronológico
        uses: actions/cache@v4
        with:
          path: .tmp/contextual-rating-replay
          key: contextual-rating-replay-v9-${{ hashFiles('src/contextual_family_replay.py', 'src/contextual_family_methodology.py') }}
      - name: Instalar dependências
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Confirmar replay existente
        run: |
          test -f .tmp/contextual-rating-replay/atp.jsonl.gz
          test -f .tmp/contextual-rating-replay/wta.jsonl.gz
      - name: Certificar fair odd contextual
        run: |
          python -m scripts.audit_contextual_consensus_calibration \
            --model data/models/fenzobot-contextual-2026-11.json \
            --replay-input-dir .tmp/contextual-rating-replay \
            --output .tmp/contextual-fair-odd-certification-v2.json
      - name: Testes específicos
        run: |
          python -m unittest \
            tests.test_contextual_consensus_calibration_audit \
            tests.test_audit_contextual_typical_rank_v1 -v
          ruff check \
            scripts/audit_contextual_consensus_calibration.py \
            scripts/audit_contextual_typical_rank_v1.py \
            src/contextual_family_calibration.py \
            tests/test_contextual_consensus_calibration_audit.py \
            tests/test_audit_contextual_typical_rank_v1.py
      - name: Guardar certificação
        uses: actions/upload-artifact@v7
        with:
          name: contextual-fair-odd-certification-v2
          path: .tmp/contextual-fair-odd-certification-v2.json
          if-no-files-found: error
