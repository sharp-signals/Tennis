[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Começar pelos erros que podem quebrar a execução. A dívida de estilo pode ser
# ativada gradualmente sem tornar o CI inutilizável no primeiro dia.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_covered = true
